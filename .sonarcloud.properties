# Shipped code apart from the developer tools: the demo server and the
# translation scripts in tools/ are never packaged.
sonar.sources=src,data,usr,pkgbuild
sonar.tests=tests,tools
sonar.sourceEncoding=UTF-8
# GTK CSS: node names (row, box, gridview…) and states (:selected) are not
# web CSS, so the web CSS rules report them as unknown.
sonar.exclusions=src/ashytv/data/style.css
